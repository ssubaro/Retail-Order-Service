# ConfigMap montado como ARCHIVO (no como variables): la imagen oficial de Postgres ejecuta
# todo *.sql que encuentre en /docker-entrypoint-initdb.d, pero SOLO la primera vez, cuando
# el volumen de datos está vacío. Si el PVC ya tiene una base, el script se ignora:
# los datos no se duplican al reiniciar el pod.
# Columnas con los nombres que genera Hibernate (customerId -> customer_id) porque la app
# arranca con ddl-auto=validate (ver 01).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE TABLE products (
        id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        sku         VARCHAR(40)    NOT NULL UNIQUE,
        name        VARCHAR(100)   NOT NULL,
        description VARCHAR(255),
        price       NUMERIC(10, 2) NOT NULL,
        stock       INTEGER        NOT NULL,
        category    VARCHAR(50),
        active      BOOLEAN        NOT NULL,
        version     BIGINT
    );

    CREATE TABLE orders (
        id             BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        customer_id    VARCHAR(50)    NOT NULL,
        status         VARCHAR(30)    NOT NULL
                       CHECK (status IN ('PENDIENTE', 'EN_PROCESO', 'ENVIADO', 'CANCELADO')),
        total          NUMERIC(12, 2) NOT NULL,
        created_at     TIMESTAMP(6)   NOT NULL,
        stock_reverted BOOLEAN        NOT NULL
    );

    CREATE TABLE order_items (
        id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        order_id   BIGINT         NOT NULL REFERENCES orders (id),
        product_id BIGINT         NOT NULL REFERENCES products (id),
        quantity   INTEGER        NOT NULL,
        unit_price NUMERIC(10, 2) NOT NULL
    );

    CREATE TABLE audit_logs (
        id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        entity_type VARCHAR(30)  NOT NULL,
        entity_id   BIGINT       NOT NULL,
        action      VARCHAR(40)  NOT NULL,
        message     VARCHAR(500) NOT NULL,
        created_at  TIMESTAMP(6) NOT NULL
    );

    -- Catálogo (mismos productos de ejemplo que src/main/resources/data.sql).
    -- El stock ya descuenta las unidades de los pedidos activos de abajo.
    INSERT INTO products (sku, name, description, price, stock, category, active, version) VALUES
        ('SKU-DEMO-001', 'Teclado Mecanico RGB',  'Switches rojos, retroiluminado', 899.00,   14, 'Electronica', true, 0),
        ('SKU-DEMO-002', 'Mouse Inalambrico',     'Sensor optico 1600dpi',          299.50,   38, 'Electronica', true, 0),
        ('SKU-DEMO-003', 'Monitor 24 pulgadas',   'Full HD, panel IPS',             2499.00,  7,  'Electronica', true, 0),
        ('SKU-DEMO-004', 'Playera Basica',        'Algodon 100%, varias tallas',    149.90,   117, 'Ropa',       true, 0),
        ('SKU-DEMO-005', 'Chamarra Impermeable',  'Resistente al agua, talla M',    899.00,   3,  'Ropa',        true, 0),
        ('SKU-DEMO-006', 'Cafetera Automatica',   '12 tazas, programable',          1199.00,  10, 'Hogar',       true, 0),
        ('SKU-DEMO-007', 'Set de Sartenes',       'Antiadherente, 3 piezas',        699.00,   25, 'Hogar',       true, 0),
        ('SKU-DEMO-008', 'Audifonos Bluetooth',   'Cancelacion de ruido activa',    1599.00,  3,  'Electronica', true, 0);

    -- Pedidos en distintos estados. Sin IDs explícitos: las columnas IDENTITY los generan, así
    -- el contador queda sincronizado y la app puede seguir insertando sin chocar.
    INSERT INTO orders (customer_id, status, total, created_at, stock_reverted) VALUES
        ('CLI-1001', 'ENVIADO',    2499.00, NOW() - INTERVAL '3 days', false),
        ('CLI-1002', 'EN_PROCESO', 1498.00, NOW() - INTERVAL '1 day',  false),
        ('CLI-1003', 'PENDIENTE',  1348.70, NOW() - INTERVAL '2 hours', false),
        ('CLI-1004', 'CANCELADO',  1199.00, NOW() - INTERVAL '5 days', true);

    -- Items: se enlazan buscando el pedido por cliente y el producto por SKU.
    INSERT INTO order_items (order_id, product_id, quantity, unit_price)
    SELECT o.id, p.id, v.quantity, p.price
    FROM (VALUES
            ('CLI-1001', 'SKU-DEMO-003', 1),
            ('CLI-1002', 'SKU-DEMO-001', 1),
            ('CLI-1002', 'SKU-DEMO-002', 2),
            ('CLI-1003', 'SKU-DEMO-004', 3),
            ('CLI-1003', 'SKU-DEMO-005', 1),
            ('CLI-1004', 'SKU-DEMO-006', 1)
         ) AS v (customer_id, sku, quantity)
    JOIN orders   o ON o.customer_id = v.customer_id
    JOIN products p ON p.sku = v.sku;
---
# PersistentVolumeClaim: "pido 1Gi de disco" para los archivos de PostgreSQL.
# En Docker Desktop lo satisface el StorageClass por defecto (hostpath o standard),
# que crea el PersistentVolume automáticamente. Sobrevive al borrado del pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce              # lo monta un solo nodo a la vez: solo Postgres escribe aquí
  resources:
    requests:
      storage: 1Gi
---
# PostgreSQL: 1 réplica. Las 3 réplicas de la app (02) NO montan el volumen: se conectan a
# esta base por la red, así que todas ven los mismos datos.
# (En producción se suele usar un StatefulSet o una base administrada; con una sola
# instancia y un PVC explícito, un Deployment con Recreate es equivalente y más simple.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate: el pod viejo suelta el volumen antes de que arranque el nuevo
  # (dos Postgres sobre los mismos archivos corromperían la base).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        # Mismos valores que usa la app: nombre de la base desde el ConfigMap y
        # credenciales desde el Secret (una sola fuente de verdad, ver 01).
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: retail-order-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: retail-order-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: retail-order-secret
              key: SPRING_DATASOURCE_PASSWORD
        # Subcarpeta dentro del volumen: initdb exige un directorio vacío
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # pg_isready: responde OK solo cuando Postgres acepta conexiones
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: datos-postgres
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: datos-postgres
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init
---
# Service ClusterIP (interno): da el nombre DNS "postgres" que usa SPRING_DATASOURCE_URL.
# No es LoadBalancer: la base no queda expuesta fuera del clúster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
