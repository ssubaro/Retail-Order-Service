# ConfigMap: configuración NO sensible, separada de la imagen.
# Los nombres siguen el "relaxed binding" de Spring Boot: cada variable sobrescribe
# una propiedad de application.properties (SERVER_PORT -> server.port, etc.).
apiVersion: v1
kind: ConfigMap
metadata:
  name: retail-order-config
data:
  APP_ENVIRONMENT: "produccion-local"
  SERVER_PORT: "8080"
  APP_ASYNC_DEMO_DELAY_MS: "1500"   # app.async.demo-delay-ms (pon "0" para correr Newman)
  SPRING_JPA_SHOW_SQL: "false"      # spring.jpa.show-sql: menos ruido en kubectl logs
  MANAGEMENT_INFO_ENV_ENABLED: "true"  # /actuator/info muestra las variables INFO_* (nombre del pod, ver 02)
  # Base de datos PostgreSQL (k8s/03-postgres.yaml). "postgres" es el nombre del Service:
  # el DNS interno del clúster lo resuelve a la IP del pod de la base.
  POSTGRES_DB: "retaildb"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/retaildb"
  # El esquema lo crea init.sql (03); Hibernate solo valida que coincida con las entidades.
  # Si una tabla o columna no coincide, la app no arranca y el error aparece en kubectl logs.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_H2_CONSOLE_ENABLED: "false"   # la consola H2 no aplica con PostgreSQL
---
# Secret: credenciales. OJO: stringData solo se codifica en base64 al guardarse, NO se cifra.
# Cualquiera con permiso de leer Secrets puede verlo (kubectl get secret ... -o yaml).
# Valores de demostración, no son credenciales reales.
# Una sola fuente de verdad: la app los usa para conectarse (envFrom en 02) y Postgres
# para crear su usuario al inicializarse (secretKeyRef en 03).
apiVersion: v1
kind: Secret
metadata:
  name: retail-order-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "retail_admin"
  SPRING_DATASOURCE_PASSWORD: "SuperSecretPassword123!"
