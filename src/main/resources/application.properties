# Configuración de la aplicación
spring.application.name=retail-order-service

# Configuración de la base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Sin driverClassName: Spring lo deduce de la URL (jdbc:h2 -> H2, jdbc:postgresql -> PostgreSQL),
# así el ConfigMap de Kubernetes puede cambiar de base solo con SPRING_DATASOURCE_URL.
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
# Sin spring.jpa.database-platform: Hibernate detecta el dialecto según la URL (H2 en local,
# PostgreSQL en Kubernetes, donde SPRING_DATASOURCE_URL lo define el ConfigMap).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datos de ejemplo (src/main/resources/data.sql): se insertan en cada arranque, DESPUÉS de que
# Hibernate crea/actualiza el esquema (ddl-auto=update). Al tratarse de una base H2 en memoria,
# todo se pierde al detener la aplicación: solo repuebla el catálogo en cada arranque.
spring.jpa.defer-datasource-initialization=true

# Retraso artificial (ms) antes de procesar notificacion/auditoria/alertas asincronas
# (OrderDomainEventListener). Solo sirve para que en una demo en vivo se note claramente que el
# procesamiento ocurre en otro hilo, DESPUES de responder al cliente: sin esto, en H2 local pasa
# tan rapido que parece sincrono. Para pruebas automatizadas (Postman/Newman/CI) desactivalo:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--app.async.demo-delay-ms=0
app.async.demo-delay-ms=1500

# Actuator: expone solo health e info. Con probes.enabled aparecen los grupos que usa Kubernetes:
#   /actuator/health/liveness  -> livenessProbe  (¿el proceso sigue vivo? si falla, K8s reinicia el contenedor)
#   /actuator/health/readiness -> readinessProbe (¿puede recibir tráfico? si falla, el Service deja de enviarle peticiones)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# En Kubernetes, cualquier propiedad de este archivo se puede sobrescribir con una variable de entorno
# (relaxed binding): spring.datasource.password -> SPRING_DATASOURCE_PASSWORD, app.async.demo-delay-ms ->
# APP_ASYNC_DEMO_DELAY_MS. Así el ConfigMap y el Secret (k8s/01-config-and-secret.yaml) configuran la app
# sin reconstruir la imagen.
